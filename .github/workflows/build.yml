name: Build Geode Mod

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: bash tests/run_tests.sh

  build:
    name: ${{ matrix.name }}
    needs: tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android64
            target: Android64
          - name: Android32
            target: Android32

    steps:
      - uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: ${{ matrix.target }}
          combine: false
          configure-args: -DGEODE_PACKAGE_ZSTD=OFF

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="${{ steps.build.outputs.build-output }}"
          PACKAGE="$(find "$OUTPUT" -maxdepth 1 -type f -name '*.geode' -print -quit)"

          echo "=== BUILD COMMIT ==="
          git rev-parse HEAD

          echo "=== PACKAGE ==="
          test -n "$PACKAGE"
          echo "$PACKAGE"
          ls -lh "$PACKAGE"

          echo "=== PACKAGE INTEGRITY ==="
          unzip -t "$PACKAGE"

          echo "=== PACKAGE CONTENTS ==="
          unzip -l "$PACKAGE"

          echo "=== EXTRACT METADATA ==="
          unzip -p "$PACKAGE" mod.json > /tmp/afc-mod.json

          python3 -c 'import json; d=json.load(open("/tmp/afc-mod.json")); assert d["id"]=="helloimhukanfr.aframecounter", d["id"]; assert d["geode"]=="5.10.1", d["geode"]; assert d["gd"]["android"]=="2.2081", d["gd"]; print("mod.json: VALID")'

          echo "=== NATIVE BINARY ==="
          if [ "${{ matrix.target }}" = "Android64" ]; then
            BINARY="$(unzip -Z1 "$PACKAGE" | grep -E '\.android64\.so$' | head -n 1)"
            test -n "$BINARY"
            echo "$BINARY"
            unzip -p "$PACKAGE" "$BINARY" > /tmp/afc.so
            file /tmp/afc.so
            file /tmp/afc.so | grep -E 'ELF 64-bit.*ARM aarch64' >/dev/null
          else
            BINARY="$(unzip -Z1 "$PACKAGE" | grep -E '\.android32\.so$' | head -n 1)"
            test -n "$BINARY"
            echo "$BINARY"
            unzip -p "$PACKAGE" "$BINARY" > /tmp/afc.so
            file /tmp/afc.so
            file /tmp/afc.so | grep -E 'ELF 32-bit.*ARM' >/dev/null
          fi

          test -s /tmp/afc.so

          echo "=== PACKAGE VERIFICATION PASSED ==="

      - name: Upload verified Android package
        uses: actions/upload-artifact@v4
        with:
          name: AFC-${{ matrix.name }}-${{ github.sha }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
