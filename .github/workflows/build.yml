name: Build Geode Mod

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: bash tests/run_tests.sh

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android32
            target: Android32
          - name: Android64
            target: Android64

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          combine: false
          configure-args: -DGEODE_PACKAGE_ZSTD=OFF

      - name: Verify package
        shell: bash
        run: |
          set -e
          echo "=== GENERATED GEODE PACKAGES ==="
          find build output -type f -name "*.geode" -print 2>/dev/null || true

          PACKAGE="$(find build output -type f -name "*.geode" -print -quit)"
          test -n "$PACKAGE"

          echo "=== PACKAGE ==="
          file "$PACKAGE"
          ls -lh "$PACKAGE"

          echo "=== PACKAGE CONTENTS ==="
          unzip -l "$PACKAGE"

          echo "=== PACKAGE INTEGRITY ==="
          unzip -t "$PACKAGE"

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: Advanced-Frame-Counter-${{ matrix.name }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
